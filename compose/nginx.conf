# Intern gateway för VM-deployen — nås bara via Cloudflare Tunnel.
#
# Mönster: Cloudflare (edge, TLS) ─▶ tunnel ─▶ cloudflared ─▶ detta nginx (HTTP).
#   - Instansen publicerar inga portar: cloudflared ringer UT till Cloudflare, så
#     det finns ingenting för skannrar att nå på instansens IP.
#   - TLS termineras i Cloudflares edge; tunneln är krypterad hela vägen till
#     instansen. nginx lyssnar bara på det interna `edge`-nätet.
#   - Riktig klient-IP återställs från CF-Connecting-IP, men bara när anslutningen
#     kommer från cloudflared (edge-nätets subnät) — ingen annan kan nå nginx.

# Rate limiting zones (http context)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=status:10m rate=60r/m;

upstream server_lux {
    server server-lux:8080 fail_timeout=0;
}

# --- Restore real client IP: only cloudflared (edge network) is trusted -------
set_real_ip_from 10.255.255.0/29;
real_ip_header CF-Connecting-IP;

# Cloudflare terminates TLS; cloudflared forwards the original scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# --- The API gateway (internal, reached only through the tunnel) -------------
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 50M;

    # Health check - rate limited, no auth
    location = / {
        limit_req zone=status burst=10 nodelay;
        proxy_pass http://server_lux;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # API endpoints - stricter rate limiting, long timeouts for inference
    location /v1/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://server_lux;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Swagger UI / API spec
    location /docs/ {
        proxy_pass http://server_lux;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /apispec.json {
        proxy_pass http://server_lux;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /flasgger_static/ {
        proxy_pass http://server_lux;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Block common scanner/exploit paths
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql)$ { return 444; }
    location ~* ^/(admin|wp-admin|phpmyadmin|login|shell|console|manager|actuator|solr|jenkins) { return 444; }

    # Drop everything else
    location / { return 444; }
}
